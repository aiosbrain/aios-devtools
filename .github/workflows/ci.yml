# CI skeleton seeded by `aios repo-bootstrap` (AIO-602). This repo owns it from here —
# the bootstrap never overwrites an existing ci.yml. The governance-gates job mirrors
# the aios-workspace invariants (ENGINEERING-CONSTITUTION.md §8): file-size cap,
# repo-boundary seams, and the confidentiality leak gate.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: governance gates (size + boundaries + leak)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: File-size gate (default-deny, ratchet-only-down)
        run: node scripts/check-file-size.mjs
      - name: Repo-boundary gate
        run: node scripts/check-boundaries.mjs
      - name: Baseline confidentiality leak gate
        # PR-controlled code never receives the private term dictionary. The always-on shape
        # rules still catch generic credentials and machine-specific paths on every event.
        env:
          AIOS_LEAK_TERMS_B64: ""
        run: bash scripts/leak-gate.sh .
      - name: Assert private leak terms present on protected main (fail closed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HAS_LEAK_TERMS: ${{ secrets.AIOS_LEAK_TERMS_B64 != '' }}
        run: |
          if [ "$HAS_LEAK_TERMS" != "true" ]; then
            echo "::error::AIOS_LEAK_TERMS_B64 repo secret is missing or empty — the confidential-identifier sweep cannot run, and a baseline-only pass must not look green on trusted events. Reinstall the secret (Settings > Secrets and variables > Actions) from the sanctioned local term file."
            exit 1
          fi
          echo "leak-gate term secret present — the identifier sweep will run."
      - name: Private confidentiality term scan on protected main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AIOS_LEAK_TERMS_B64: ${{ secrets.AIOS_LEAK_TERMS_B64 }}
        run: bash scripts/leak-gate.sh .

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - name: Lint
        run: |
          if [ -f package.json ]; then npm run lint --if-present; else echo "no package.json — skipping lint"; fi

  test:
    name: unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolkit-dependent suites resolve core-owned content (spec rubric, delivery skill
      # suite, validation/ gate tree) and the stays-core seam engines through a real AIOS
      # toolkit checkout (docs/devtools-toolkit-contract.md): without AIOS_TOOLKIT_DIR
      # they skip with a named reason by design — this checkout makes them run.
      - name: Checkout AIOS toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aiosbrain/aios-workspace
          # AIO-685 contract pin: current core candidate, including corrected SR18 semantics.
          # Keep exact-SHA pinned so the CI input is reproducible; bumps must reconcile drift.
          ref: a48356602eb73c41b6945de8211aabc4064e8a65
          path: toolkit-checkout
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - name: Provision toolkit (deps + operator-loop dist)
        working-directory: toolkit-checkout
        run: |
          npm ci
          # compiled operator loop dist — the spec-eval advisory path loads it via the seam
          npm run build:loop --if-present
      - name: Test
        env:
          AIOS_TOOLKIT_DIR: ${{ github.workspace }}/toolkit-checkout
        run: |
          if [ -f package.json ]; then npm run test --if-present; else echo "no package.json — skipping tests"; fi

  # AIO-699 — advisory-only lane: mirrors the `unit tests` job above but resolves the
  # toolkit checkout against core `main` instead of the AIO-685 pin, so pin drift shows up
  # here (red) well before it silently rots the pinned lane. Non-blocking status MUST come
  # from branch protection (this check simply is not in the required set) — not from
  # `continue-on-error`, which would report green at the check level even when the job
  # fails internally and recreate the exact silent-drift problem this lane exists to catch.
  # See docs/devtools-toolkit-contract.md for the reconcile-then-bump procedure.
  #
  # Residual risk: permissions are constrained — no repository/user secrets are passed to
  # floating-core run steps; checkout receives the job's read-only GITHUB_TOKEN, which is
  # not persisted (persist-credentials: false on both checkouts). That does NOT make the
  # lane safe on its own —
  # it still runs `npm run build:loop` from floating core, dynamically imports core source,
  # and executes dependency code selected by core's changing lockfile, all with runner
  # network access. timeout-minutes bounds a hung/runaway install or build.
  toolkit-drift:
    name: toolkit drift (advisory, core main)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolkit-dependent suites resolve core-owned content (spec rubric, delivery skill
      # suite, validation/ gate tree) and the stays-core seam engines through a real AIOS
      # toolkit checkout (docs/devtools-toolkit-contract.md): without AIOS_TOOLKIT_DIR
      # they skip with a named reason by design — this checkout makes them run.
      - name: Checkout AIOS toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aiosbrain/aios-workspace
          # AIO-699: track core main directly (never a pin) so drift from the AIO-685 pin
          # surfaces here first, not silently on the pinned lane.
          ref: main
          path: toolkit-checkout
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Provision toolkit (deps + operator-loop dist)
        # AIO-699 / AIO-680 class: this checkout tracks core's floating `main`, so its
        # install-time lifecycle scripts are unreviewed. --ignore-scripts removes that one
        # vector (confirmed no functional loss: core's package-lock.json pins prebuilt
        # native binaries — e.g. better-sqlite3 ships prebuilds/, no compile step — and the
        # one script this repo actually needs, building the operator-loop dist, is run
        # explicitly below via `npm run build:loop`, the same call core's postinstall makes
        # via scripts/ensure-loop-built.mjs). Verified 2026-08-03: `npm ci --ignore-scripts`
        # + `npm run build:loop --if-present` against a fresh core main clone, then the full
        # devtools toolkit-dependent suite (AIOS_TOOLKIT_DIR) — 205 tests, 201 pass, 0 fail,
        # 4 skipped, identical to the scripts-enabled result.
        # This does NOT make the step safe overall: `npm run build:loop` still executes
        # arbitrary TypeScript/JS from floating core, and the subsequent Test step
        # dynamically imports core source and runs dependency code selected by core's
        # changing lockfile, with full runner network access. timeout-minutes on the job
        # bounds a hung/runaway run; there is no sandboxing beyond that here.
        working-directory: toolkit-checkout
        run: |
          npm ci --ignore-scripts
          # compiled operator loop dist — the spec-eval advisory path loads it via the seam
          npm run build:loop --if-present
      - name: Test
        env:
          AIOS_TOOLKIT_DIR: ${{ github.workspace }}/toolkit-checkout
        run: |
          if [ -f package.json ]; then npm run test --if-present; else echo "no package.json — skipping tests"; fi

  # AIO-594 PR A — the no-toolkit behavior lane: proves the package is standalone-green
  # (seam-dependent suites skip with a NAMED reason, never crash) exactly as a fresh
  # `npm install @aiosbrain/aios-devtools` consumer without a workspace would see it.
  test-no-toolkit:
    name: tests (no toolkit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Test without a toolkit (AIOS_TOOLKIT_DIR unset)
        run: npm test

  # The publish path runs a DIFFERENT npm major than every lane above. Trusted publishing
  # needs npm >= 11.5.1, so publish-npm.yml installs the pin from `.npm-version`, while every
  # other job here runs whatever npm ships bundled with Node 22 (10.x/11.x). That divergence
  # was invisible to CI, and it bit: npm 12 changed two `--json` output shapes —
  # `npm view <exact-spec> version --json` went from a bare string to a single-element array,
  # and `npm pack --json` went from an array of records to an OBJECT keyed by package name.
  # Two tests parsed the old shapes. They stayed green on every PR and broke only inside the
  # publish workflow's own `npm test` gate, which is reachable solely by manual dispatch, so
  # nothing reported it until a release was attempted (fixed in #11 — this lane fixes the
  # class, not that instance).
  #
  # This job reproduces the publish job's environment — Node 22, the pinned npm, no toolkit —
  # and runs the same `npm test` gate, so the next such difference (including the next time
  # Node's bundled npm moves under us) fails a PR check instead of a release.
  #
  # WHY NOT just pin this npm everywhere: `tests (no toolkit)` on the bundled npm is what
  # proves the suite works for a fresh `npm install @aiosbrain/aios-devtools` consumer, who
  # has whatever npm their Node shipped. Pinning every lane would delete that coverage and
  # couple all of CI to one npm bump. Two lanes, one pin, read from one file.
  test-publish-npm:
    name: tests (publish lane npm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Byte-identical install line to publish-npm.yml, reading the same `.npm-version`.
      # The exact x.y.z assertion is not cosmetic: a range or `latest` here would silently
      # stop testing the version that actually publishes, which is the whole point.
      # --ignore-scripts matches the publish job's supply-chain hygiene.
      - name: Install the pinned npm the publish workflow uses
        run: |
          PINNED_NPM="$(tr -d '[:space:]' < .npm-version)"
          if ! printf '%s' "$PINNED_NPM" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::.npm-version must contain an exact x.y.z npm version (got '$PINNED_NPM')"
            exit 1
          fi
          npm install -g "npm@$PINNED_NPM" --ignore-scripts
          npm --version
      # This package declares no install/prepare lifecycle scripts, so --ignore-scripts is a
      # behavioural no-op here and simply keeps dependency lifecycle code from running.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test on the publish lane's npm (AIOS_TOOLKIT_DIR unset)
        run: npm test

  # AIO-594 PR A — clean production install + package verification: npm pack, assert the
  # files allowlist, install the tarball into a fresh temp project, run the installed
  # `aios-devtools` bin and resolve the exports map (test/pack-install.test.mjs).
  pack-verify:
    name: pack and install verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Pack, verify tarball contents, install into a temp project, run the bin
        run: node --test --test-force-exit test/pack-install.test.mjs
